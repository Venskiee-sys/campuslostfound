# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
# Keep the Kotlin compile daemon inside the same budget so the two daemons
# cannot between them exhaust this machine's 7.3 GB of RAM.
kotlin.daemon.jvmargs=-Xmx1024m
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# --- Supabase (replaces Firebase) ---
# Get these from: Supabase Dashboard → Project Settings → API
# See SUPABASE_SETUP.md for the full setup guide.
# BASE project URL only. supabase-kt appends /auth/v1, /rest/v1, /storage/v1
# and /realtime/v1 itself — adding "/rest/v1/" here made every request land on
# .../rest/v1//auth/v1/... and 404.
supabase.url=https://ijnzcgokaqukeswskgcp.supabase.co
supabase.anonKey=sb_publishable_sZ0GDXM_1DMWoKZWa6A2NA_TxOdoIIe
# --- Google Maps ---
# Maps SDK for Android key (Google Cloud Console -> APIs & Services ->
# Credentials). Consumed by the manifestPlaceholders in app/build.gradle.kts.
maps.apiKey=YOUR_API_KEY_HERE
# --- Google sign-in ("Continue with Google") ---
# Web application OAuth client ID from the Google Cloud Console. The Android
# client ID (package name + SHA-1) and the Supabase provider are set up in the
# same Google Cloud project — see SUPABASE_SETUP.md -> "Google sign-in".
# Leave the placeholder to keep the Google button showing a setup hint instead
# of opening an account picker that Google would reject.
google.webClientId=928926470825-jqrcn4tlar54q6360ta4b15j9of4mopd.apps.googleusercontent.com